name: PR CI

on:
  pull_request:

concurrency:
  group: ci-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 26.4.1
        run: sudo xcode-select -s /Applications/Xcode_26.4.1.app

      - name: Cache DerivedData
        uses: actions/cache@v4
        with:
          path: ~/Library/Developer/Xcode/DerivedData
          key: derived-data-xcode2641-${{ hashFiles('Byeolsai/Byeolsai.xcodeproj/project.pbxproj') }}
          restore-keys: derived-data-xcode2641-

      - name: Build and test
        run: |
          DEVICE=$(xcrun simctl list devices available | grep -oE 'iPhone [^(]+' | head -1 | xargs)
          echo "Simulator: $DEVICE"
          xcodebuild test \
            -project Byeolsai/Byeolsai.xcodeproj \
            -scheme Byeolsai \
            -destination "platform=iOS Simulator,name=$DEVICE" \
            CODE_SIGNING_ALLOWED=NO
